<!DOCTYPE html>
<!--
  ACCOUNTING.BIZ - одностраничный сайт-картотека. Один файл, без сборки.
  ЧТО ЗАМЕНИТЬ ПЕРЕД ЗАПУСКОМ:
   1) Фото сотрудников и логотип уже вшиты в файл (base64) - внешних картинок нет.
      Заменить фото: объект PHOTOS внизу скрипта.
   2) Телефон / почта / WhatsApp / адрес - секция «КОНТАКТЫ» в HTML (tel:, mailto:, wa.me)
   3) Цены и состав тарифов - ключи p1p / p2p / p3p и p*f* в объекте I18N (RU и KZ)
   4) Приём заявок - функция sendForm(), блок «ЗДЕСЬ подключается приём заявок»

  ЯЗЫК И ТЕМА: сейчас жёстко русский + светлая тема. Казахские тексты сохранены
  в объекте I18N, тёмная тема - в html[data-theme="dark"]. Чтобы вернуть выбор,
  достаточно вызвать applyLang('kz') / сменить data-theme на <html>.
-->
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ACCOUNTING.BIZ - бухгалтерия для чемпионов</title>
<meta name="description" content="Профессиональная бухгалтерия для малого и среднего бизнеса. Онлайн и офлайн. Казахстан.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ACCOUNTING.BIZ - single file site
   Навигация «папки-закладки», без скролла. RU / KZ. Light / Dark.
   ============================================================ */

/* ---------- ТОКЕНЫ ---------- */
:root{
  /* - координаты окна - */
  --tabH:5.3vh;        /* высота основной закладки */
  --rowTop:9vh;        /* верх ряда закладок (раздел открыт) */
  --sheetTop:14.3vh;   /* верхняя кромка листа раздела */
  --dock:84vh;         /* «полка» на главной */
  --footTop:91.6vh;    /* подложка низа */
  --plateTop:81.4vh;   /* выступ с логотипом */
  --plateW:21%;
  /* - координаты внутри листа раздела - */
  --subTabH:4.4vh;     /* высота подзакладки */
  --rRow2:4.5vh;       /* подзакладка 1 уровня */
  --rSub1:8.9vh;
  --rRow3:12.1vh;      /* подзакладка 2 уровня */
  --rSub2:16.5vh;
  --rDockTab:65vh;     /* закрытые папки: закладка */
  --rDock:69.4vh;      /* закрытые папки: корпус */
  --edgeL:5.5vw;
  --slant:1.5rem;
  --tabTail:3.4vh;     /* часть закладки, скрытая за папкой */
  --subTail:2.6vh;
  --ease:cubic-bezier(.7,.02,.2,1);
  --spring:cubic-bezier(.28,1.02,.36,1);   /* мягкий доводчик: папка «садится» на место */
  --dur:.62s;
}

html[data-theme="light"]{
  --paper:#F8F7EC;
  --paper2:#FDFCF3;
  --ink:#134D2D;
  --ink2:#2C6C46;
  --muted:#6B8375;
  --g1:#6ACD70;
  --g2:#3CB94E;
  --g3:#189B41;
  --g4:#087732;
  --onG1:#0E4327;
  --onG:#FFFFFF;
  --btn:#8FE28C;
  --btnInk:#0E3F26;
  --btnHover:#78D976;
  --line:rgba(19,77,45,.20);
  --line2:rgba(19,77,45,.10);
  --sealRing:#1D8A44;
  --heroA:#FBFAF0;
  --heroB:#93D492;
  --heroC:#6CC46E;
  --shadow:0 1.2rem 3rem -1.4rem rgba(19,77,45,.35);
  --card:#EFEDDA;              /* картон папки: подложка низа */
  --cardLine:rgba(19,77,45,.16);
  --edgeHi:rgba(255,255,255,.75);
  --lift:0 -.85rem 2.2rem -.9rem rgba(19,77,45,.28);
  --liftSm:0 -.5rem 1.2rem -.5rem rgba(19,77,45,.22);
  --sheen:radial-gradient(130% 70% at 50% 0%, rgba(255,255,255,.6), transparent 62%);
}
html[data-theme="dark"]{
  --paper:#101A15;
  --paper2:#15211B;
  --ink:#E9F3E7;
  --ink2:#B7D3BB;
  --muted:#87A491;
  --g1:#2E7C43;
  --g2:#24693A;
  --g3:#1B5730;
  --g4:#124326;
  --onG1:#E8F6E7;
  --onG:#EAF6E9;
  --btn:#39A35A;
  --btnInk:#04160C;
  --btnHover:#46BB69;
  --line:rgba(190,224,193,.22);
  --line2:rgba(190,224,193,.10);
  --sealRing:#4FB56B;
  --heroA:#0C1410;
  --heroB:#1C4F31;
  --heroC:#256A40;
  --shadow:0 1.2rem 3rem -1.4rem rgba(0,0,0,.7);
  --card:#0B120E;
  --cardLine:rgba(190,224,193,.16);
  --edgeHi:rgba(190,224,193,.22);
  --lift:0 -.85rem 2.2rem -.9rem rgba(0,0,0,.6);
  --liftSm:0 -.5rem 1.2rem -.5rem rgba(0,0,0,.5);
  --sheen:radial-gradient(130% 70% at 50% 0%, rgba(255,255,255,.05), transparent 62%);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html{
  font-size:clamp(9px, 1.15vh + .42vw, 18px);
  height:100%;
}
body{
  height:100%;
  overflow:hidden;
  background:var(--paper);
  color:var(--ink);
  font-family:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  transition:background .5s var(--ease), color .5s var(--ease);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--g3);outline-offset:3px;border-radius:.3rem}

/* ---------- ФОН ---------- */
.bg{position:fixed;inset:0;background:var(--heroA);z-index:0}
.bg::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(120% 95% at 100% 0%, var(--heroC) 0%, var(--heroB) 26%, transparent 62%),
    radial-gradient(70% 55% at -12% 62%, var(--heroB) 0%, transparent 60%);
  opacity:.95;
}

/* ---------- КАРКАС ---------- */
.stage{position:fixed;inset:0;z-index:1;perspective:1700px;perspective-origin:50% 0}

.wordmark{
  position:absolute;top:3.2vh;right:var(--edgeL);
  font-size:.66rem;font-weight:700;letter-spacing:.22em;
  color:var(--ink2);opacity:.85;z-index:60;
}


/* ---------- ПОДЛОЖКА НИЗА: картон папки + шильд с логотипом ---------- */
.foot{position:absolute;left:0;right:0;top:var(--plateTop);bottom:0;z-index:38;pointer-events:none}
.foot-band{
  position:absolute;left:0;right:0;bottom:0;
  top:calc(var(--footTop) - var(--plateTop));
  background:var(--card);border-top:1px solid var(--cardLine);
  box-shadow:0 -.5rem 1.4rem -.7rem rgba(19,77,45,.25);
}
.foot-plate{
  position:absolute;left:0;top:0;bottom:0;width:var(--plateW);
  background:var(--card);
  clip-path:polygon(0 0, calc(100% - 1.9rem) 0, 100% 3.4rem, 100% 100%, 0 100%);
  filter:drop-shadow(0 -1px 0 var(--cardLine)) drop-shadow(0 -.45rem 1.1rem rgba(19,77,45,.22));
  display:flex;align-items:center;gap:.95rem;
  padding:0 1rem 1.4vh 1.6vw;
}
.foot-seal{flex:none;width:8.4vh;height:8.4vh;min-width:58px;min-height:58px}
.foot-seal img{width:100%;height:100%;display:block;object-fit:contain}
.foot-txt{min-width:0}
.foot-case{font-size:.62rem;font-weight:800;letter-spacing:.16em;color:var(--ink)}
.foot-sheet{
  margin-top:.3rem;font-size:.55rem;font-weight:700;letter-spacing:.1em;
  color:var(--muted);white-space:nowrap;
}
@keyframes rollin{from{transform:translateY(75%);opacity:0}to{transform:none;opacity:1}}
.foot-sheet.roll{animation:rollin .48s var(--spring)}
.foot-tag{
  position:absolute;right:var(--edgeL);bottom:0;
  height:calc(100% - (var(--footTop) - var(--plateTop)));
  display:flex;align-items:center;
  font-size:.66rem;font-weight:800;letter-spacing:.2em;color:var(--ink2);opacity:.85;
}

/* ---------- ВОДЯНОЙ ЗНАК ---------- */
.wm{
  position:absolute;right:3.5%;top:50%;width:min(46vh,33vw);aspect-ratio:1;
  z-index:21;pointer-events:none;
  opacity:0;transform:translateY(-50%) rotate(-9deg) scale(.92);
  transition:opacity 1s var(--ease) .5s, transform 1.4s var(--ease) .5s;
}
body.booted .wm{opacity:.055;transform:translateY(-50%) rotate(-7deg) scale(1)}
.wm img{width:100%;height:100%;display:block}

/* ---------- ПЕРФОРАЦИЯ ПОЛЯ ПАПКИ ---------- */
.punch{
  position:absolute;left:2.4vw;top:36vh;height:22vh;width:1.5vh;z-index:41;
  display:flex;flex-direction:column;justify-content:space-between;
  opacity:0;pointer-events:none;transition:opacity .5s var(--ease) .3s;
}
body[data-view="section"] .punch{opacity:1}
.punch i{
  width:1.5vh;height:1.5vh;min-width:11px;min-height:11px;border-radius:50%;
  background:var(--heroA);
  box-shadow:inset 0 .12rem .28rem rgba(19,77,45,.38), 0 1px 0 rgba(255,255,255,.75);
}

/* ---------- ЛИСТ РАЗДЕЛА ---------- */
.sheet{
  position:absolute;left:0;right:0;top:var(--sheetTop);bottom:0;
  background:var(--paper);background-image:var(--sheen);
  border-top:1px solid var(--edgeHi);
  box-shadow:var(--lift);
  opacity:0;visibility:hidden;pointer-events:none;
  transform:translateY(3.4rem) rotateX(4deg) scale(.993);
  transform-origin:50% 0;
  transition:opacity .3s var(--ease), transform var(--dur) var(--spring), visibility 0s .5s;
  z-index:20;
}
.sheet.on{
  opacity:1;visibility:visible;pointer-events:auto;
  transform:none;transition:opacity .28s var(--ease), transform var(--dur) var(--spring), visibility 0s 0s;
}
/* торцы вложенных листов, выглядывающие из папки */
.sheet::before,.sheet::after,.drawer::before,.drawer::after{
  content:'';position:absolute;height:1.15rem;
  background:var(--paper2);border-radius:.55rem .55rem 0 0;
  box-shadow:var(--liftSm);border-top:1px solid var(--edgeHi);
  z-index:-1;pointer-events:none;
}
.sheet::before,.drawer::before{left:4.5%;width:11%;top:-1.02rem}
.sheet::after,.drawer::after{left:12.2%;width:7.5%;top:-.74rem}

/* нижняя «полка» на главной */
.drawer{
  position:absolute;left:0;right:0;top:var(--dock);bottom:0;
  background:var(--paper);background-image:var(--sheen);
  border-top:1px solid var(--edgeHi);
  box-shadow:var(--lift);
  z-index:20;
  transition:transform var(--dur) var(--spring), opacity .4s var(--ease);
}
body[data-view="section"] .drawer{transform:translateY(20vh);opacity:0}

/* ---------- ЗАКЛАДКИ ---------- */
.tabrow{
  position:absolute;left:23%;right:2.2vw;
  top:calc(var(--dock) - var(--tabH));
  height:var(--tabH);
  display:flex;align-items:flex-start;gap:1.5%;
  transition:top var(--dur) var(--ease);
}
body[data-view="section"] .tabrow{top:var(--rowTop)}

.tab{
  flex:1;position:relative;z-index:18;          /* уходит за корпус папки */
  height:calc(var(--tabH) + var(--tabTail));
  display:flex;align-items:center;justify-content:center;
  padding:0 .6rem var(--tabTail) 1.3rem;
  border-radius:.8rem .8rem 0 0;
  clip-path:polygon(0 calc(100% - var(--tabTail)), var(--slant) 0,
                    calc(100% - .55rem) 0, 100% calc(100% - var(--tabTail)),
                    100% 100%, 0 100%);
  font-size:.72rem;font-weight:800;letter-spacing:.13em;
  white-space:nowrap;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.30);
  transition:background .35s var(--ease), color .35s var(--ease),
             filter .25s, transform .38s var(--spring);
}
.tab i{font-style:normal;font-size:.6rem;opacity:.5;margin-right:.55rem;letter-spacing:.06em}
.tab:hover{filter:brightness(1.07);transform:translateY(-.4rem)}
.tab:active{transform:translateY(-.15rem)}
.tab.pull{transform:translateY(-.85rem)}
.subtab.pull{transform:translateY(-.7rem)}
/* закладка и корпус закрытой папки приподнимаются вместе */
.subtab.peek{transform:translateY(-.45rem)}
.folder.peek{transform:translateY(-.45rem)}
.tab[data-i="0"]{background:var(--g1);color:var(--onG1)}
.tab[data-i="1"]{background:var(--g2);color:var(--onG)}
.tab[data-i="2"]{background:var(--g3);color:var(--onG)}
.tab[data-i="3"]{background:var(--g4);color:var(--onG)}
.tab.act{background:var(--paper);color:var(--ink);cursor:default;transform:none;box-shadow:none;z-index:24}

/* ---------- ПАПКИ ВТОРОГО УРОВНЯ ---------- */
.folder{
  position:absolute;bottom:0;
  background:var(--paper2);
  border-top:1px solid var(--line);
  border-left:1px solid var(--line);
  border-right:1px solid var(--line);
  border-radius:1rem 1rem 0 0;
  box-shadow:var(--liftSm);
  transition:top var(--dur) var(--spring), left var(--dur) var(--spring),
             right var(--dur) var(--spring), transform .38s var(--spring);
}
/* торцы документов, выглядывающие из раскрытой папки */
.folder::before,.folder::after{
  content:'';position:absolute;height:1.05rem;
  background:var(--paper);border-radius:.5rem .5rem 0 0;
  border-top:1px solid var(--edgeHi);box-shadow:var(--liftSm);
  opacity:0;z-index:-1;pointer-events:none;
  transition:opacity .45s var(--ease) .15s;
}
.folder::before{left:6%;width:9%;top:-.92rem}
.folder::after{left:13.4%;width:6.5%;top:-.66rem}
[data-sub="leader"] .folder[data-f="leader"]::before,
[data-sub="leader"] .folder[data-f="leader"]::after,
[data-sub="team"] .folder[data-f="team"]::before,
[data-sub="team"] .folder[data-f="team"]::after{opacity:1}
.subtab{
  position:absolute;height:calc(var(--subTabH) + var(--subTail));
  display:flex;align-items:center;justify-content:center;
  padding:0 .5rem var(--subTail) 1.2rem;
  background:var(--paper2);color:var(--g3);
  border-radius:.75rem .75rem 0 0;
  clip-path:polygon(0 calc(100% - var(--subTail)), 1.25rem 0,
                    calc(100% - .5rem) 0, 100% calc(100% - var(--subTail)),
                    100% 100%, 0 100%);
  font-size:.68rem;font-weight:800;letter-spacing:.13em;white-space:nowrap;
  box-shadow:var(--liftSm);
  transition:top var(--dur) var(--spring), filter .25s, transform .38s var(--spring);
}
.subtab:not(.act):hover{filter:brightness(.975);transform:translateY(-.4rem)}
html[data-theme="dark"] .subtab:not(.act):hover{filter:brightness(1.25)}
.subtab::before{
  content:'';position:absolute;left:0;right:0;top:0;bottom:0;
  border-top:1px solid var(--line);border-left:1px solid var(--line);border-right:1px solid var(--line);
  border-radius:.75rem .75rem 0 0;
  clip-path:polygon(0 calc(100% - var(--subTail)), 1.25rem 0,
                    calc(100% - .5rem) 0, 100% calc(100% - var(--subTail)),
                    100% 100%, 0 100%);
  pointer-events:none;
}
.subtab.act{cursor:default;color:var(--g3)}

/* позиции подзакладок / папок.
   Слои: закладка уходит ЗА свою папку (хвост прячется), но остаётся
   ПЕРЕД соседней - иначе раскрытая папка перехватывала бы по ней клик. */
.subtab[data-f="leader"]{left:55.5%;width:20.6%;z-index:28}
.folder[data-f="leader"]{z-index:29}
.subtab[data-f="leader"].act{z-index:32}
.subtab[data-f="team"]{left:77.3%;right:1.6vw;width:auto;z-index:31}
.folder[data-f="team"]{z-index:33}
.subtab[data-f="team"].act{z-index:34}

/* состояние: обзор */
[data-sub="overview"] .folder[data-f="leader"]{top:var(--rDock);left:55.5%;right:22.7%}
[data-sub="overview"] .subtab[data-f="leader"]{top:var(--rDockTab)}
[data-sub="overview"] .folder[data-f="team"]{top:var(--rDock);left:77.3%;right:0}
[data-sub="overview"] .subtab[data-f="team"]{top:var(--rDockTab)}

/* состояние: руководство */
[data-sub="leader"] .folder[data-f="leader"]{top:var(--rSub1);left:0;right:22.7%}
[data-sub="leader"] .subtab[data-f="leader"]{top:var(--rRow2)}
[data-sub="leader"] .folder[data-f="team"]{top:var(--rDock);left:77.3%;right:0}
[data-sub="leader"] .subtab[data-f="team"]{top:var(--rDockTab)}

/* состояние: команда */
[data-sub="team"] .folder[data-f="leader"]{top:var(--rSub1);left:0;right:22.7%}
[data-sub="team"] .subtab[data-f="leader"]{top:var(--rRow2)}
[data-sub="team"] .folder[data-f="team"]{top:var(--rSub2);left:0;right:0}
[data-sub="team"] .subtab[data-f="team"]{top:var(--rRow3)}

.fbody{
  position:absolute;inset:0;overflow:hidden;border-radius:inherit;
  opacity:0;visibility:hidden;
  transition:opacity .34s var(--ease) .12s, visibility 0s .46s;
}
[data-sub="leader"] .folder[data-f="leader"] .fbody,
[data-sub="team"]   .folder[data-f="team"]   .fbody{
  opacity:1;visibility:visible;transition:opacity .38s var(--ease) .22s, visibility 0s 0s;
}

/* ---------- «НА ГЛАВНУЮ» ---------- */
.backhome{
  position:absolute;top:4.5vh;right:var(--edgeL);
  display:flex;align-items:center;gap:.7rem;
  font-size:.7rem;font-weight:600;letter-spacing:.03em;color:var(--ink2);
  z-index:45;
}
.backhome svg{width:3.4rem;height:.7rem;stroke:currentColor;fill:none;stroke-width:1;
  transition:transform .4s var(--spring)}
.backhome:hover{color:var(--g3)}
.backhome:hover svg{transform:translateX(-.35rem)}

/* ---------- ГЛАВНАЯ ---------- */
.home{
  position:absolute;left:23%;right:8%;top:23vh;
  z-index:22;
  transition:opacity .45s var(--ease), transform var(--dur) var(--ease);
}
body[data-view="section"] .home{opacity:0;transform:translateY(-3vh);pointer-events:none}
h1{
  font-size:3.75rem;line-height:1.08;font-weight:800;letter-spacing:-.02em;
  max-width:19ch;
}
.lead{
  margin-top:1.8rem;font-size:1.03rem;line-height:1.5;font-weight:500;color:var(--ink2);
  max-width:34ch;
}

/* ---------- КНОПКА ---------- */
.cta{
  display:inline-flex;align-items:center;justify-content:space-between;gap:2.4rem;
  margin-top:2.6rem;padding:1rem 1.3rem 1rem 1.4rem;
  min-width:15rem;
  background:var(--btn);color:var(--btnInk);
  border-radius:.35rem;
  font-size:.72rem;font-weight:800;letter-spacing:.1em;
  box-shadow:var(--shadow);
  transition:background .25s, transform .25s var(--ease);
}
.cta:hover{background:var(--btnHover);transform:translateY(-2px)}
.cta:active{transform:translateY(0)}
.cta svg{width:1.15rem;height:.75rem;stroke:currentColor;fill:none;stroke-width:1.6;flex:none;
  transition:transform .4s var(--spring)}
.cta:hover svg{transform:translateX(.32rem)}

/* ---------- ТИПОГРАФИКА КОНТЕНТА ---------- */
.pad{position:absolute;left:23%;right:6%;top:11.5vh}
h2{
  font-size:1.42rem;line-height:1.3;font-weight:800;letter-spacing:-.01em;max-width:26ch;
}
h2 .lg{font-size:1.42rem}
.body{
  margin-top:1.5rem;font-size:.72rem;line-height:1.75;font-weight:600;color:var(--ink2);max-width:48ch;
}
.checks{margin-top:2.2rem;display:flex;flex-direction:column;gap:.85rem}
.chk{display:flex;gap:.85rem;align-items:flex-start;font-size:.66rem;font-weight:700;line-height:1.45}
.chk i{
  flex:none;width:.85rem;height:.85rem;margin-top:.1rem;border-radius:.18rem;
  background:var(--g2);position:relative;
}
.chk i::after{
  content:'';position:absolute;left:.24rem;top:.1rem;width:.24rem;height:.44rem;
  border:solid var(--paper);border-width:0 .12rem .12rem 0;transform:rotate(42deg);
}

/* ---------- РУКОВОДСТВО ---------- */
.leadWrap{
  position:absolute;left:12.4%;right:6%;top:7.5vh;
  display:flex;gap:3.2rem;align-items:flex-start;
}
.portrait{
  position:relative;flex:none;width:11.5rem;aspect-ratio:83/100;
  transition:transform .5s var(--spring);
}
.portrait::before{
  content:'';position:absolute;left:-.6rem;top:.6rem;right:.6rem;bottom:-.6rem;
  background:var(--g2);border-radius:1rem;
  transition:transform .5s var(--spring);
}
.member:hover .portrait,.leadWrap:hover .portrait{transform:translate(.28rem,-.34rem)}
.member:hover .portrait::before,.leadWrap:hover .portrait::before{transform:translate(-.28rem,.34rem)}
.portrait .frame{
  position:absolute;inset:0;border-radius:1rem;overflow:hidden;
  box-shadow:0 .7rem 1.6rem -.8rem rgba(19,77,45,.4);
  background:linear-gradient(160deg,var(--g1),var(--g4));
  display:flex;align-items:center;justify-content:center;
}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.initials{font-size:2rem;font-weight:800;color:rgba(255,255,255,.85);letter-spacing:.05em}
.pname{font-size:1.18rem;font-weight:800;letter-spacing:-.01em}
.prole{margin-top:.5rem;font-size:.62rem;font-weight:800;line-height:1.7;color:var(--ink)}
.pdots{margin-top:1.1rem;display:flex;flex-direction:column;gap:.35rem}
.pdots li{
  list-style:none;position:relative;padding-left:.9rem;
  font-size:.62rem;font-weight:800;line-height:1.5;
}
.pdots li::before{
  content:'';position:absolute;left:.1rem;top:.42rem;width:.22rem;height:.22rem;border-radius:50%;background:var(--ink);
}
.pnote{margin-top:1.4rem;font-size:.62rem;line-height:1.7;font-weight:600;color:var(--muted);max-width:44ch}

/* ---------- КОМАНДА ---------- */
.teamGrid{
  position:absolute;left:11%;right:8%;top:6.5vh;
  display:grid;grid-template-columns:repeat(4,1fr);gap:2.2rem;
}
.member .portrait{width:100%}
.mname{margin-top:1.1rem;font-size:.66rem;font-weight:800;line-height:1.35}
.mmeta{margin-top:.55rem;font-size:.55rem;font-weight:800;line-height:1.75;color:var(--ink2)}
.mmeta .lvl{color:var(--g3);letter-spacing:.09em}

/* ---------- УСЛУГИ ---------- */
.svcGrid{
  position:absolute;left:12%;right:8%;top:21vh;
  display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;
}
.svc{
  background:var(--paper2);border:1px solid var(--line2);border-radius:1rem;
  padding:1.3rem 1.2rem;position:relative;overflow:hidden;
  transition:transform .3s var(--ease), border-color .3s;
}
.svc:hover{transform:translateY(-.4rem);border-color:var(--line);box-shadow:0 1rem 2rem -1rem rgba(19,77,45,.3)}
.svc .num{
  font-size:.55rem;font-weight:800;letter-spacing:.16em;color:var(--g2);
}
.svc h3{margin-top:.7rem;font-size:.85rem;font-weight:800;line-height:1.3}
.svc p{margin-top:.7rem;font-size:.6rem;line-height:1.6;font-weight:600;color:var(--muted)}
.svc::after{
  content:'';position:absolute;left:0;top:0;width:0;height:3px;background:var(--g2);
  transition:width .4s var(--ease);
}
.svc:hover::after{width:100%}

/* ---------- ТАРИФЫ ---------- */
.plans{
  position:absolute;left:14%;right:10%;top:20vh;
  display:grid;grid-template-columns:repeat(3,1fr);gap:1.6rem;
}
.plan{
  border:1px solid var(--line);border-radius:1.1rem;padding:1.5rem 1.3rem;
  background:var(--paper2);display:flex;flex-direction:column;
  transition:transform .3s var(--ease);
}
.plan:hover{transform:translateY(-.45rem);box-shadow:0 1.1rem 2.2rem -1.1rem rgba(19,77,45,.35)}
.plan.hot{background:var(--g4);border-color:var(--g4);color:var(--onG)}
.plan.hot .pprice,.plan.hot .pfeat li{color:inherit}
.plan .badge{
  align-self:flex-start;font-size:.5rem;font-weight:800;letter-spacing:.16em;
  padding:.3rem .55rem;border-radius:.3rem;background:var(--btn);color:var(--btnInk);
  margin-bottom:.8rem;
}
.pttl{font-size:.95rem;font-weight:800;letter-spacing:.02em}
.psub{margin-top:.4rem;font-size:.56rem;font-weight:700;letter-spacing:.08em;opacity:.75}
.pprice{margin-top:1.1rem;font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.pprice small{font-size:.55rem;font-weight:700;opacity:.7;letter-spacing:.04em}
.pfeat{margin-top:1.2rem;display:flex;flex-direction:column;gap:.5rem}
.pfeat li{list-style:none;position:relative;padding-left:.95rem;font-size:.6rem;font-weight:600;line-height:1.5;color:var(--ink2)}
.pfeat li::before{
  content:'';position:absolute;left:0;top:.36rem;width:.3rem;height:.16rem;
  border:solid currentColor;border-width:0 0 .1rem .1rem;transform:rotate(-45deg);opacity:.7;
}
.pnote2{
  position:absolute;left:14%;right:10%;bottom:14vh;
  font-size:.56rem;font-weight:600;color:var(--muted);
}

/* ---------- КОНТАКТЫ ---------- */
.contactWrap{
  position:absolute;left:14%;right:10%;top:21vh;
  display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:start;
}
.cline{display:block;padding:.9rem 0;border-bottom:1px solid var(--line2);text-decoration:none;color:inherit}
.cline .lab{font-size:.52rem;font-weight:800;letter-spacing:.16em;color:var(--g3)}
.cline .val{margin-top:.3rem;font-size:.92rem;font-weight:800;letter-spacing:-.01em}
a.cline{transition:padding-left .35s var(--spring),border-color .3s}
a.cline:hover{padding-left:.55rem;border-color:var(--g2)}
a.cline:hover .val{color:var(--g3)}
.form{display:flex;flex-direction:column;gap:.7rem}
.form label{font-size:.52rem;font-weight:800;letter-spacing:.16em;color:var(--muted)}
.form input,.form textarea{
  width:100%;padding:.75rem .85rem;border:1px solid var(--line);border-radius:.5rem;
  background:var(--paper2);color:var(--ink);font-family:inherit;font-size:.68rem;font-weight:600;line-height:1.4;
}
.form textarea{resize:none;height:4.4rem}
.form input:focus,.form textarea:focus{outline:none;border-color:var(--g2)}
.formMsg{font-size:.6rem;font-weight:700;color:var(--g3);min-height:1rem}

/* ---------- МОДАЛКА ЗАЯВКИ ---------- */
.modal{
  position:fixed;inset:0;z-index:200;display:none;
  align-items:center;justify-content:center;padding:1.5rem;
  background:rgba(8,30,18,.42);backdrop-filter:blur(6px);
}
.modal.on{display:flex;animation:fade .3s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mcard{
  width:min(28rem,92vw);background:var(--paper);border-radius:1.2rem;
  padding:2rem 1.8rem;box-shadow:0 2rem 5rem -1rem rgba(0,0,0,.5);
  border:1px solid var(--line2);
  animation:pop .38s var(--ease);
}
@keyframes pop{from{transform:translateY(1.5rem) scale(.97);opacity:0}to{transform:none;opacity:1}}
.mcard h3{font-size:1.15rem;font-weight:800;letter-spacing:-.01em}
.mcard p{margin-top:.5rem;font-size:.62rem;font-weight:600;color:var(--muted);line-height:1.6}
.mclose{position:absolute;top:1.2rem;right:1.2rem;font-size:1.2rem;line-height:1;color:var(--muted)}
.mwrap{position:relative}

/* ---------- АНИМАЦИЯ ПОЯВЛЕНИЯ ---------- */
.rise{opacity:0;transform:translateY(1.1rem)}
.on .rise, .home .rise{animation:rise .62s var(--ease) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.rise:nth-child(1){animation-delay:.10s}
.rise:nth-child(2){animation-delay:.17s}
.rise:nth-child(3){animation-delay:.24s}
.rise:nth-child(4){animation-delay:.31s}
.rise:nth-child(5){animation-delay:.38s}
.rise:nth-child(6){animation-delay:.45s}
.rise:nth-child(7){animation-delay:.52s}
.rise:nth-child(8){animation-delay:.59s}

/* ---------- ОТКРЫТИЕ ПАПКИ ПРИ ЗАГРУЗКЕ ---------- */
.tabrow{transition:top var(--dur) var(--ease),
        transform 1.05s var(--spring) .42s}
.drawer{transition:transform var(--dur) var(--spring),
        opacity .4s var(--ease), box-shadow .4s}
.foot-seal{transform-origin:50% 100%;
      transition:opacity .5s ease .75s, transform .95s var(--spring) .75s}
body:not(.booted) .foot-seal{opacity:0;transform:scale(.6) rotate(-22deg)}
.wordmark{transition:opacity .7s ease .25s, transform .7s var(--ease) .25s}

body:not(.booted) .tabrow{transform:translateY(12rem)}
body:not(.booted) .drawer{transform:translateY(7rem);opacity:0}
body:not(.booted) .wordmark{opacity:0;transform:translateY(-.6rem)}
.foot-plate,.foot-band,.foot-tag{transition:opacity .6s ease .5s, transform .95s var(--spring) .5s}
body:not(.booted) .foot-plate{opacity:0;transform:translateY(4rem)}
body:not(.booted) .foot-band{opacity:0;transform:translateY(2.5rem)}
body:not(.booted) .foot-tag{opacity:0;transform:translateY(1.4rem)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

@media (max-width:1100px){
  h1{font-size:3.2rem}
  .home{left:10%;right:6%}
  .pad{left:10%}
  .leadWrap{left:8%;gap:2rem}
  .teamGrid{left:7%;right:7%;gap:1.4rem}
  .svcGrid{left:8%;right:8%}
  .tabrow{left:14%}
}

@media (max-width:760px), (max-height:520px){
  :root{
    --tabH:4.8vh;--rowTop:6vh;--sheetTop:10.8vh;--dock:80vh;

    --rRow2:3.4vh;--rSub1:7.8vh;--rRow3:10.6vh;--rSub2:15vh;

    --footTop:88vh;--plateTop:88vh;--plateW:100%;
  }

  .subtab[data-f="leader"]{left:4vw;width:44%}
  .subtab[data-f="team"]{left:50vw;right:4vw}
  [data-sub="overview"] .folder[data-f="leader"],
  [data-sub="leader"] .folder[data-f="team"],

  [data-sub="leader"] .folder[data-f="leader"],
  [data-sub="team"] .folder[data-f="leader"]{left:0;right:0}
  h1{font-size:2.1rem;max-width:16ch}
  .home{left:7vw;right:7vw;top:16vh}
  .lead{font-size:.85rem;margin-top:1.1rem}
  .pad{left:7vw;right:7vw;top:5vh}
  h2{font-size:1.1rem}
  .body{font-size:.66rem;margin-top:1rem}
  .checks{margin-top:1.2rem;gap:.6rem}
  .leadWrap{left:7vw;right:7vw;top:5vh;flex-direction:column;gap:1.2rem}
  .portrait{width:8rem}
  .teamGrid{left:6vw;right:6vw;top:3.5vh;grid-template-columns:repeat(2,1fr);gap:.9rem 1rem}
  .member .portrait{aspect-ratio:1/1}
  .mname{margin-top:.6rem;font-size:.6rem}
  .mmeta{margin-top:.3rem;font-size:.52rem;line-height:1.5}
  .leadWrap .portrait{width:7rem}
  .pname{font-size:.95rem}
  .pnote{margin-top:.8rem}
  .svcGrid{left:7vw;right:7vw;top:5vh;grid-template-columns:repeat(2,1fr);gap:.8rem}
  .plans{left:7vw;right:7vw;top:5vh;grid-template-columns:1fr;gap:.7rem}
  .plan{padding:.9rem 1rem}
  .pprice{margin-top:.5rem;font-size:1.1rem}
  .pfeat{margin-top:.6rem;gap:.3rem}
  .contactWrap{left:7vw;right:7vw;top:5vh;grid-template-columns:1fr;gap:1.2rem}
  .wordmark{font-size:.55rem}
  .foot-tag{display:none}
  .foot-plate{width:100%;clip-path:none;padding:0 4vw 1.2vh 4vw;gap:.8rem}
  .foot-seal{width:52px;height:52px;min-width:52px;min-height:52px}
  .foot-case{font-size:.6rem}
  .foot-sheet{font-size:.52rem}
  .punch{display:none}
  .wm{width:38vh;right:-6%;opacity:0}
  body.booted .wm{opacity:.045}
  .tab i{display:none}
  .backhome{top:3vh}
  .backhome svg{width:2rem}
  /* безопасный клапан: если контент всё же не влез на маленьком экране */
  .scrollsafe{overflow:auto;-webkit-overflow-scrolling:touch;max-height:calc(100% - 12vh);padding-bottom:2rem}
}
/* --- невысокие экраны: карточки команды не должны уходить под подложку --- */
@media (max-height:700px){
  .teamGrid{gap:1rem}
  .member .portrait{aspect-ratio:1/1}
  .mname{margin-top:.6rem}
  .mmeta{margin-top:.35rem;line-height:1.5}
  .leadWrap .portrait{width:9rem}
}
@media (max-height:660px){
  .member .portrait{aspect-ratio:5/4}
  .mmeta{font-size:.5rem}
}

/* ============================================================
   3. ЛОГИКА
   ============================================================ */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];

const state = { lang:'ru', theme:'light', page:null };

/* --- язык --- */
function applyLang(lang){
  state.lang = lang;
  const d = I18N[lang];
  $$('[data-i18n]').forEach(el=>{
    const v = d[el.dataset.i18n];
    if(v !== undefined) el.textContent = v;
  });
  document.documentElement.lang = (lang==='kz') ? 'kk' : 'ru';
  document.title = (lang==='kz')
    ? 'ACCOUNTING.BIZ - чемпиондарға арналған бухгалтерия'
    : 'ACCOUNTING.BIZ - бухгалтерия для чемпионов';
}

/* --- фото --- */
function applyPhotos(){
  $$('[data-photo]').forEach(ph=>{
    const src = PHOTOS[ph.dataset.photo];
    if(!src) return;
    const img = new Image();
    img.src = src; img.alt = '';
    ph.parentElement.replaceChildren(img);
  });
}

/* --- строка описи в подложке: показывает, какой лист открыт --- */
const SHEET_NO = {about:1, services:2, pricing:3, contacts:4};
const SUB_NO   = {leader:1, team:2};
function updateDossier(){
  const d = I18N[state.lang], el = $('#dossier');
  if(!el) return;
  let txt;
  if(!state.page){
    txt = d.dossierHome;
  }else{
    const key = 'tab' + state.page[0].toUpperCase() + state.page.slice(1);
    const sheet = $(`.sheet[data-page="${state.page}"]`);
    const sub = sheet && sheet.dataset.sub;
    const no = SHEET_NO[state.page] + (sub && SUB_NO[sub] ? '.' + SUB_NO[sub] : '');
    txt = `${d[key]} · ${d.sheetWord} ${no} / 4`;
  }
  if(el.textContent === txt) return;
  el.classList.remove('roll'); void el.offsetWidth;
  el.textContent = txt;
  el.classList.add('roll');
}

/* --- навигация по разделам --- */
function openPage(name){
  $$('.sheet').forEach(s=>s.classList.toggle('on', s.dataset.page===name));
  $$('.tab').forEach(t=>t.classList.toggle('act', t.dataset.go===name));
  document.body.dataset.view = 'section';
  state.page = name;
  restartRise($(`.sheet[data-page="${name}"]`));
  updateDossier();
  history.replaceState(null,'','#'+name);
}
function goHome(){
  $$('.sheet').forEach(s=>{ s.classList.remove('on'); if(s.dataset.sub) s.dataset.sub='overview'; });
  $$('.tab').forEach(t=>t.classList.remove('act'));
  document.body.dataset.view = 'home';
  state.page = null;
  restartRise($('.home'));
  updateDossier();
  history.replaceState(null,'','#');
}
function restartRise(scope){
  if(!scope) return;
  $$('.rise',scope).forEach(el=>{
    el.style.animation='none'; void el.offsetWidth; el.style.animation='';
  });
}

/* --- подпапки в «О нас» --- */
function openSub(sheet, f){
  const cur = sheet.dataset.sub;
  sheet.dataset.sub = (cur===f) ? 'overview' : f;
  $$('.peek', sheet).forEach(el=>el.classList.remove('peek'));
  updateDossier();
  $$('.subtab',sheet).forEach(t=>t.classList.toggle('act', t.dataset.f===sheet.dataset.sub));
  const body = $(`.folder[data-f="${f}"] .fbody`, sheet);
  if(body && sheet.dataset.sub===f) setTimeout(()=>restartRise(body), 180);
}

/* --- заявки --- */
function openModal(){ $('#leadModal').classList.add('on'); setTimeout(()=>$('#lf-name').focus(),120); }
function closeModal(){ $('#leadModal').classList.remove('on'); }

function sendForm(prefix){
  const phone = $('#'+prefix+'-phone').value.trim();
  const out   = $('#'+prefix+'-msgout');
  if(phone.replace(/\D/g,'').length < 10){
    out.style.color='#C0392B';
    out.textContent = I18N[state.lang].errPhone;
    return;
  }
  const data = {
    name:  ($('#'+prefix+'-name')||{}).value || '',
    phone: phone,
    msg:   ($('#'+prefix+'-msg')||{}).value || '',
    lang:  state.lang,
    page:  state.page || 'home'
  };

  /* ---- ЗДЕСЬ подключается приём заявок ----
     Пример (Telegram-бот):
     fetch('https://api.telegram.org/bot<TOKEN>/sendMessage',{
       method:'POST', headers:{'Content-Type':'application/json'},
       body:JSON.stringify({chat_id:'<CHAT_ID>',
         text:`Заявка ACCOUNTING.BIZ\n${data.name}\n${data.phone}\n${data.msg}`})
     });
  ------------------------------------------- */
  console.log('LEAD →', data);

  out.style.color='';
  out.textContent = I18N[state.lang].sent;
  ['-name','-phone','-msg'].forEach(s=>{ const el=$('#'+prefix+s); if(el) el.value=''; });
  if(prefix==='lf') setTimeout(closeModal, 2200);
}

/* --- закрытая папка приподнимается целиком, а не одной закладкой --- */
function peekPair(sheet, f, on){
  if(sheet.dataset.sub === f) on = false;          // раскрытую папку не трогаем
  const tab = $(`.subtab[data-f="${f}"]`, sheet);
  const fol = $(`.folder[data-f="${f}"]`, sheet);
  [tab, fol].forEach(el=>el && el.classList.toggle('peek', on));
}
$$('.sheet[data-sub]').forEach(sheet=>{
  ['leader','team'].forEach(f=>{
    [$(`.subtab[data-f="${f}"]`, sheet), $(`.folder[data-f="${f}"]`, sheet)].forEach(el=>{
      if(!el) return;
      el.addEventListener('mouseenter', ()=>peekPair(sheet, f, true));
      el.addEventListener('mouseleave', ()=>peekPair(sheet, f, false));
    });
  });
});

/* --- короткий «рывок»: папку как будто тянут за закладку --- */
function pull(el){
  el.classList.remove('peek');
  el.classList.add('pull');
  setTimeout(()=>el.classList.remove('pull'), 230);
}

/* --- делегирование событий --- */
document.addEventListener('click', e=>{
  const tab = e.target.closest('.tab');
  if(tab){ if(!tab.classList.contains('act')){ pull(tab); openPage(tab.dataset.go); } return; }

  const sub = e.target.closest('.subtab');
  if(sub){ pull(sub); openSub(sub.closest('.sheet'), sub.dataset.f); return; }

  const act = e.target.closest('[data-act]');
  if(act){
    const a = act.dataset.act;
    if(a==='home')  goHome();
    if(a==='lead')  openModal();
    if(a==='close') closeModal();
    if(a==='send')  sendForm(act.dataset.form);
    return;
  }
  if(e.target.id==='leadModal') closeModal();
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeModal(); if(state.page) goHome(); }
});

/* --- запрет любого скролла --- */
document.addEventListener('touchmove', e=>{
  if(!e.target.closest('.scrollsafe')) e.preventDefault();
}, {passive:false});
window.addEventListener('wheel', e=>{
  if(!e.target.closest('.scrollsafe')) e.preventDefault();
}, {passive:false});

/* --- старт --- */
/* Язык по умолчанию: 'ru'. Казахская версия готова в I18N - для включения
   переключателя достаточно вызвать applyLang('kz'). */
applyLang('ru');
applyPhotos();
updateDossier();
requestAnimationFrame(()=>document.body.classList.add('booted'));
</script>
